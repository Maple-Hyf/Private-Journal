<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Journal — Login Test</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--text:#181818;--muted:#6f6f69;--border:#deded8;--soft:#f0f0ec;--ok:#2f6f3d;--danger:#a33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{width:min(560px,calc(100% - 28px));margin:60px auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-size:12px;margin-bottom:8px}
h1{margin:0 0 8px;font-size:28px;letter-spacing:-.4px}
.sub{color:var(--muted);line-height:1.55;font-size:14px;margin-bottom:22px}
button{min-height:44px;border:none;border-radius:11px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}
.primary{background:#171717;color:#fff}.secondary{background:var(--soft);color:var(--text);border:1px solid var(--border)}
button:disabled{opacity:.45;cursor:not-allowed}
.status{margin-top:18px;border:1px solid var(--border);background:#fafaf8;border-radius:12px;padding:14px;font-size:14px;line-height:1.55}
.label{color:var(--muted);font-size:12px;margin-bottom:2px}.value{word-break:break-all;margin-bottom:10px}
.message{margin-top:12px;font-size:13px;color:var(--muted);min-height:20px}.ok{color:var(--ok)}.error{color:var(--danger)}.hidden{display:none}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
<div class="eyebrow">Private Journal</div>
<h1>Firebase login test</h1>
<div class="sub">This page only tests authentication. It does not create, read, or store journal entries.</div>
<button id="signInBtn" class="primary" type="button">Sign in with Google</button>
<button id="signOutBtn" class="secondary hidden" type="button">Sign out</button>
<div id="accountBox" class="status hidden">
<div class="label">Signed in as</div><div id="emailValue" class="value"></div>
<div class="label">Firebase UID</div><div id="uidValue" class="value"></div>
</div>
<div id="message" class="message">Checking Firebase…</div>
</section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDdrVBF-4iHS9gcryZyA6zvlcHf98UWzk0",
  authDomain: "private-journal-40773.firebaseapp.com",
  projectId: "private-journal-40773",
  storageBucket: "private-journal-40773.firebasestorage.app",
  messagingSenderId: "61998448621",
  appId: "1:61998448621:web:c712df902fc6140b30b1e4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const signInBtn = document.getElementById("signInBtn");
const signOutBtn = document.getElementById("signOutBtn");
const accountBox = document.getElementById("accountBox");
const emailValue = document.getElementById("emailValue");
const uidValue = document.getElementById("uidValue");
const message = document.getElementById("message");

function setMessage(text, kind=""){
  message.textContent = text;
  message.className = "message" + (kind ? " " + kind : "");
}

signInBtn.addEventListener("click", async () => {
  signInBtn.disabled = true;
  setMessage("Opening Google sign-in…");
  try {
    await signInWithPopup(auth, provider);
  } catch (error) {
    console.error(error);
    setMessage((error.code || "auth/error") + ": " + error.message, "error");
  } finally {
    signInBtn.disabled = false;
  }
});

signOutBtn.addEventListener("click", async () => {
  signOutBtn.disabled = true;
  try {
    await signOut(auth);
  } catch (error) {
    console.error(error);
    setMessage((error.code || "auth/error") + ": " + error.message, "error");
  } finally {
    signOutBtn.disabled = false;
  }
});

onAuthStateChanged(auth, (user) => {
  if (user) {
    emailValue.textContent = user.email || "(no email)";
    uidValue.textContent = user.uid;
    accountBox.classList.remove("hidden");
    signInBtn.classList.add("hidden");
    signOutBtn.classList.remove("hidden");
    setMessage("Authentication works ✓", "ok");
  } else {
    accountBox.classList.add("hidden");
    signInBtn.classList.remove("hidden");
    signOutBtn.classList.add("hidden");
    setMessage("Not signed in.");
  }
});
</script>
</body>
</html>
